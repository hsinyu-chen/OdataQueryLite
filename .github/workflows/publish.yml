name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true

permissions:
  contents: read
  # OIDC token used by NuGet/login to exchange a short-lived API key per run.
  # Replaces the long-lived NUGET_API_KEY secret; revoke that secret after the
  # first successful Trusted Publishing run.
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  Configuration: Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SourceLink wants full history for commit-sha mapping.

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration $Configuration --no-restore -p:Version=${{ steps.ver.outputs.version }} -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test --configuration $Configuration --no-build --no-restore

      - name: Pack OdataQueryLite
        run: dotnet pack src/OdataQueryLite/OdataQueryLite.csproj --configuration $Configuration --no-build --no-restore -p:Version=${{ steps.ver.outputs.version }} -o ./nupkgs

      - name: Pack OdataQueryLite.AspNetCore
        run: dotnet pack src/OdataQueryLite.AspNetCore/OdataQueryLite.AspNetCore.csproj --configuration $Configuration --no-build --no-restore -p:Version=${{ steps.ver.outputs.version }} -o ./nupkgs

      - name: List packed artifacts
        run: ls -la ./nupkgs

      - name: NuGet login (Trusted Publishing OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: hsinyu-chen

      - name: Push to NuGet
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
